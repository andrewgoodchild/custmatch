# Release: push a tag vX.Y.Z (matching both pyproject versions). Builds both packages and
# publishes them to PyPI with trusted publishing (no token: configure each project's trusted
# publisher on pypi.org first - repository andrewgoodchild/custmatch, workflow release.yml,
# environment pypi), and pushes the service image to ghcr.io/andrewgoodchild/custmatch-server.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The tag matches both package versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$v\"" pyproject.toml
          grep -q "^version = \"$v\"" server/pyproject.toml
      - name: Build
        run: |
          pip install build twine
          python -m build --outdir dist .
          python -m build --outdir dist server
          twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: dist, path: dist/}

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with: {skip-existing: true}   # a rerun after a partial upload finishes the rest

  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/andrewgoodchild/custmatch-server:${{ github.ref_name }}
            ghcr.io/andrewgoodchild/custmatch-server:latest
