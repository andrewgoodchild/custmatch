# Release: push a tag vX.Y.Z (matching both pyproject versions). Builds both packages and
# publishes them to PyPI with trusted publishing (no token: configure each project's trusted
# publisher on pypi.org first - repository andrewgoodchild/custmatch, workflow release.yml,
# environment pypi), and pushes the service image to ghcr.io/andrewgoodchild/custmatch-server.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The tag matches both package versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$v\"" pyproject.toml
          grep -q "^version = \"$v\"" server/pyproject.toml
      - name: Build
        run: |
          pip install build twine
          python -m build --outdir dist .
          python -m build --outdir dist server
          twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: dist, path: dist/}

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/andrewgoodchild/custmatch-server:${{ github.ref_name }}
            ghcr.io/andrewgoodchild/custmatch-server:latest
